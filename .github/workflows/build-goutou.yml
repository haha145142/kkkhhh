name: Build GoutouJunshi Android APK

on:
  push:
    branches: [goutoujunshi-android-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: goutoujunshi-android/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s goutoujunshi-android/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh goutoujunshi-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-android-v1.1.0-debug
          path: goutoujunshi-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
